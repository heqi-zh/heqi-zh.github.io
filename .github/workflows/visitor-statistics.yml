name: Sync visitor locations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: visitor-statistics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check API configuration
        id: configuration
        shell: bash
        run: |
          if [ -n "$GOATCOUNTER_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Add GOATCOUNTER_API_TOKEN in repository Secrets to enable the visitor globe data."
          fi
      - name: Fetch aggregate visitor countries
        if: steps.configuration.outputs.ready == 'true'
        run: python3 scripts/sync-goatcounter.py
      - name: Publish country snapshot
        if: steps.configuration.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/visitor-locations.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update aggregate visitor countries'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
