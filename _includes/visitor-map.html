<div class="visitor-map" id="visitor-map-panel" data-goatcounter-endpoint="https://heqi-zh.goatcounter.com/count" data-site-url="https://heqi-zh.github.io/" data-state="loading">
  <p class="visitor-map__summary" hidden aria-live="polite">Loading visitor locations…</p>
  <svg class="visitor-map__canvas" viewBox="0 0 640 460" role="img" tabindex="0" aria-labelledby="visitor-map-title visitor-map-description">
    <title id="visitor-map-title">Visitors around the world</title>
    <desc id="visitor-map-description">Drag to rotate the map, or use the arrow keys. Small dots show approximate visitor locations.</desc>
    <path class="visitor-map__ocean" aria-hidden="true"></path>
    <g class="visitor-map__land" fill-rule="evenodd">
    </g>
    <g class="visitor-map__markers"></g>
  </svg>

</div>
<script src="assets/js/geo/d3-array.min.js" defer></script>
<script src="assets/js/geo/d3-geo.min.js" defer></script>
<script src="assets/js/visitor-map.js?v={{ site.time | date: '%s' }}" defer></script>
